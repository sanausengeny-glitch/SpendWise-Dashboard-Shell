<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>SpendWise</h2>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Transactions</a>
            <a href="#">Budget</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </nav>
    </aside>

    <header class="header">
        <h1>Financial Dashboard</h1>
        <p>Monthly Overview</p>
    </header>

    <main class="cards">

        <div class="card" tabindex="0">
            <h3>Food</h3>
            <p>KES 12,500</p>
        </div>

        <div class="card" tabindex="0">
            <h3>Transport</h3>
            <p>KES 6,200</p>
        </div>

        <div class="card" tabindex="0">
            <h3>Rent</h3>
            <p>KES 18,000</p>
        </div>

        <div class="card" tabindex="0">
            <h3>Entertainment</h3>
            <p>KES 4,300</p>
        </div>

        <div class="card" tabindex="0">
            <h3>Savings</h3>
            <p>KES 10,000</p>
        </div>

        <div class="card" tabindex="0">
            <h3>Utilities</h3>
            <p>KES 3,800</p>
        </div>

    </main>

</div>

</body>
</html>
